[workspace]
resolver = "2"
members = ["crates/ime-core", "crates/pinyin", "crates/wubi", "crates/handwriting", "crates/lexicon", "crates/ime-macros", "crates/user-data", "crates/omarchy-ime"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
ime-core = { path = "crates/ime-core" }
pinyin = { path = "crates/pinyin" }
fst = "0.4.7"

